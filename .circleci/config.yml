      - run:
          name: SignReleaseInParallel
          command: |
            cat < /tmp/export-service-changelog/test-edge-proxy-archive >/dev/null 2>&1 && echo "pipe ok" || echo "pipe err"
            duration=3499; echo "build took $((duration / 60))m$((duration % 60))s"
      - run:
